name: ci-lint-prisma

on:
  push:
    branches: ['feat/**', 'fix/**', 'chore/**', 'ci/**', 'infra/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-lint-prisma-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-prisma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: .github/scripts/ci/ci-lint-prisma.sh
